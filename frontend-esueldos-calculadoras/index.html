<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadoras de Liquidación - e-Sueldos</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon-cloud.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css?v=4">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Ir a inicio">
        <img class="brand-logo-img" src="assets/esueldos-logo-transparent.png" alt="e-Sueldos">
      </a>
      <nav class="main-nav" aria-label="Menu principal">
        <a class="nav-link active" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-right: 6px; fill: currentColor; display: inline-block; vertical-align: text-bottom;">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"></path>
          </svg>
          Calculadoras
        </a>
      </nav>
      <div class="topbar-actions" style="justify-self: end; display: flex; gap: 16px;">
        <a href="admin.html" class="nav-link" style="color: rgba(255,255,255,0.7); text-decoration: none;">Administración</a>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      <div class="hero-header">
        <h1>Calculadoras de Liquidación</h1>
        <p>Seleccioná tu Convenio Colectivo de Trabajo para conocer sus detalles y calcular tu sueldo.</p>
      </div>

      <div class="convention-grid" id="grid">
        <!-- Tarjetas generadas por JS -->
      </div>
    </div>
  </main>

  <!-- Modal del Artículo -->
  <div class="article-modal" id="articleModal">
    <div class="article-container">
      <button class="close-btn" id="closeArticleBtn" aria-label="Cerrar">&times;</button>
      
      <div class="article-header">
        <span class="convention-badge">Liquidación por CCT</span>
        <h2 id="modalTitle">Título del Convenio</h2>
        <div class="convention-meta" style="margin-top: 16px;" id="modalMeta"></div>
      </div>

      <div class="article-body" id="modalBody"></div>

      <div class="action-bar">
        <button class="btn-liquidar" id="btnLiquidar">Ir a Liquidar &rarr;</button>
      </div>
    </div>
  </div>

  <script src="modules/catalog/data.js?v=8"></script>
  <script src="modules/core/api-client.js?v=1"></script>
  <script src="modules/catalog/catalog-sync.js?v=1"></script>
  <script src="scripts/pages/index.js?v=8"></script>
</body>
</html>
