      <a class="brand" href="index.html" aria-label="Ir a inicio">

            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"></path>

    <div class="calculator-section" id="calculatorSection" style="margin-top: 24px; padding-top: 0; border-top: none;">

      <div class="iframe-container" style="margin: 0 -24px; overflow: hidden;">

    </div>

    <!-- Cuerpo del artículo -->
