<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Hola Mucho! 😊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glow: 0 0 20px rgba(146, 141, 171, 0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Ambient floating smilies background */
        .ambient-smilies {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .smiley-bubble {
            position: absolute;
            font-size: 3rem;
            animation: floatUpDown 8s infinite ease-in-out;
            opacity: 0.2;
        }

        .smiley-bubble:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .smiley-bubble:nth-child(2) { top: 70%; left: 15%; animation-delay: 2s; }
        .smiley-bubble:nth-child(3) { top: 20%; right: 15%; animation-delay: 4s; }
        .smiley-bubble:nth-child(4) { top: 75%; right: 10%; animation-delay: 6s; }
        .smiley-bubble:nth-child(5) { top: 45%; left: 80%; animation-delay: 1s; }
        .smiley-bubble:nth-child(6) { top: 50%; left: 5%; animation-delay: 5s; }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        /* Glassmorphic Container */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), var(--glow);
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 450px;
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #e2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #d1c9e8;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 1.5rem;
        }

        .emoji-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 16px;
            font-size: 2.2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .emoji-box:hover {
            transform: translateY(-8px) scale(1.1);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: var(--glow);
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="ambient-smilies">
        <div class="smiley-bubble">😊</div>
        <div class="smiley-bubble">🥰</div>
        <div class="smiley-bubble">😁</div>
        <div class="smiley-bubble">🥳</div>
        <div class="smiley-bubble">🤩</div>
        <div class="smiley-bubble">😸</div>
    </div>

    <div class="card">
        <h1>¡Hola Mucho!</h1>
        <p>¡Aquí tienes tu página llena de caras felices y buenas vibras!</p>
        <div class="grid">
            <div class="emoji-box">😊</div>
            <div class="emoji-box">😄</div>
            <div class="emoji-box">🎉</div>
            <div class="emoji-box">🚀</div>
            <div class="emoji-box">💫</div>
            <div class="emoji-box">🥳</div>
        </div>
    </div>

</body>
</html>
