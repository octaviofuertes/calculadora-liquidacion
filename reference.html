<style>

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}

/* HDR */
.hdr{background:var(--azul);height:60px;display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}

.hdr-sp{flex:1}
.hbtn{height:34px;border-radius:7px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:0 14px;display:flex;align-items:center;gap:6px;font-family:var(--font);transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.22)}

/* PAGE */
.page{max-width:var(--mw);margin:0 auto;padding:26px 16px 48px}
.pg-ttl{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}

.pg-head{margin-bottom:20px}

/* MAIN TABS */
.mn{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);padding:5px;border-radius:var(--r);width:fit-content;border:1px solid var(--border);box-shadow:var(--sh)}
.mn-t{padding:7px 20px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-3);font-family:var(--font);border:none;background:transparent;transition:.15s}
.mn-t.active{background:var(--azul);color:#fff}
.mn-t:hover:not(.active){background:var(--bg);color:var(--text)}
.ms{display:none}.ms.active{display:block}

/* STEPPER */
.stepper{display:flex;align-items:center;background:var(--surface);border-radius:var(--r);padding:13px 20px;box-shadow:var(--sh);margin-bottom:18px;border:1px solid var(--border);overflow-x:auto;gap:0}
.step{display:flex;align-items:center;gap:7px}

.snum{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--text-3);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--border);transition:.3s}
.step.active .snum{background:var(--azul);color:#fff;border-color:var(--azul);box-shadow:0 0 0 3px rgba(21,101,192,.18)}
.step.done .snum{background:var(--azul-dk);color:#fff;border-color:var(--azul-dk)}
.slbl{font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap}
.step.active .slbl{color:var(--azul);font-weight:700}
.step.done .slbl{color:var(--azul-dk)}

/* CARD */
.card{background:var(--surface);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh);margin-bottom:16px;border:1px solid var(--border)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--border)}
.ct{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:9px}
.cic{width:28px;height:28px;border-radius:7px;background:var(--azul-lt);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* FORM */
.fg{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:4px}
.fg.g1{grid-template-columns:1fr}.fg.g3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{border:1.5px solid var(--border);border-radius:7px;padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);transition:.2s;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.hint{font-size:11px;color:var(--text-3)}.hint.ok{color:var(--ok);font-weight:600}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bb{background:var(--azul-lt);color:var(--azul)}.bg2{background:var(--ok-bg);color:var(--ok)}
.bw{background:var(--warn-bg);color:var(--warn)}.br{background:var(--err-bg);color:var(--err)}

/* TOGGLE */
.tw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.tw:last-child{border-bottom:none}
.tilbl{font-size:13px;font-weight:600;color:var(--text)}.tisub{font-size:11px;color:var(--text-3);margin-top:2px}
.tg{position:relative;width:40px;height:22px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0}
.tsl{position:absolute;cursor:pointer;inset:0;background:#CBD5E0;border-radius:22px;transition:.25s}
.tsl:before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.tsl{background:var(--azul)}
input:checked+.tsl:before{transform:translateX(18px)}

/* SECTION DIVIDER dentro de card */
.sec-div{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-top:4px;border-top:1px dashed var(--border)}
.sec-div:first-of-type{margin-top:4px;border-top:none}

/* CALLOUT */
.callout{display:flex;gap:10px;padding:11px 15px;border-radius:8px;font-size:12px;margin-bottom:14px;line-height:1.6}
.callout.info{background:var(--info-bg);border-left:3px solid var(--info);color:var(--info)}
.callout.warn{background:var(--warn-bg);border-left:3px solid var(--warn);color:var(--warn)}
.callout.ok{background:var(--ok-bg);border-left:3px solid var(--ok);color:var(--ok)}
.ci{font-size:15px;flex-shrink:0;margin-top:1px}

.pvbox{background:var(--azul-lt);border:1.5px solid var(--azul-mid);border-radius:8px;padding:12px 16px;margin-top:10px;display:none}
.pvbox.show{display:block}
.pvbox strong{display:block;font-size:10px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pvgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pvi{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.pvk{color:var(--text-2)}.pvv{font-family:var(--mono);font-weight:700;color:var(--azul)}

/* INASISTENCIAS */
.ii{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:7px;margin-bottom:6px;border:1px solid var(--border)}

/* BTNS */
.btn{padding:9px 20px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--font);transition:.15s;white-space:nowrap}
.bp{background:var(--azul);color:#fff}.bp:hover{background:var(--azul-dk)}
.bs{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}.bs:hover{border-color:var(--azul);color:var(--azul)}
.bsuc{background:var(--ok);color:#fff}.bsuc:hover{background:#1B5E20}
.bgh{background:transparent;border:none;color:var(--text-2);padding:7px 12px;border-radius:7px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer}.bgh:hover{background:var(--bg)}
.bdng{background:var(--err-bg);color:var(--err);border:none;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer}
.bsm{padding:6px 14px;font-size:12px}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* PASO */
.paso{display:none}.paso.active{display:block}

/* RES TABS */
.rtabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.rt{padding:7px 16px;border:1.5px solid var(--border);background:var(--surface);border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-2);transition:.15s;font-family:var(--font)}
.rt.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.rt:hover:not(.active){border-color:var(--azul);color:var(--azul)}

/* STAT CARDS */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sc{background:var(--surface);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);border:1px solid var(--border)}
.scl{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.scv{font-size:18px;font-weight:800;font-family:var(--mono);letter-spacing:-.4px}
.scs{font-size:11px;color:var(--text-3);margin-top:3px}

/* RECIBO */
.rwrap{font-size:13px}
.rhdr{background:linear-gradient(135deg,var(--azul-xdk),var(--azul));color:#fff;padding:18px 22px;border-radius:var(--r);margin-bottom:16px}
.remp{font-size:18px;font-weight:800;letter-spacing:-.3px}
.rmeta{font-size:12px;opacity:.8;margin-top:5px;display:flex;flex-wrap:wrap;gap:14px}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.rblk h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding-bottom:8px;border-bottom:1.5px solid var(--border);margin-bottom:8px;color:var(--text-3)}
.rblk h4.gh{color:var(--ok);border-color:#A5D6A7}
.rblk h4.rh{color:var(--err);border-color:#FFCDD2}
.rrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid #F5F7FA}
.rc{color:var(--text-2);flex:1;padding-right:8px;line-height:1.4;font-size:13px}
.rm{font-family:var(--mono);font-size:13px;font-weight:700;min-width:110px;text-align:right}
.rm.pos{color:var(--ok)}.rm.neg{color:var(--err)}.rm.neu{color:var(--text)}
.rsub{display:flex;justify-content:space-between;background:var(--azul-lt);padding:8px 12px;border-radius:7px;margin-top:8px;font-weight:700;font-size:13px;color:var(--azul)}
/* No rem */
.rnr{background:#FFFDE7;border:1.5px solid #F9A825;border-radius:8px;padding:12px 16px;margin-bottom:12px}
.rnr h4{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--warn);margin-bottom:8px}
/* Contrib */
.rcont{background:#FFF8E1;border:1.5px solid #FFB300;border-radius:8px;padding:12px 16px;margin-bottom:12px}
.rcont h4{font-size:10px;font-weight:700;text-transform:uppercase;color:#E65100;margin-bottom:8px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.cr2{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04)}
.cr2 .ck{color:var(--text-2)}.cr2 .cv{font-family:var(--mono);font-weight:700}
.csub{display:flex;justify-content:space-between;background:rgba(230,81,0,.1);padding:8px 12px;border-radius:6px;margin-top:8px;font-weight:700;font-size:13px;color:var(--warn)}
/* Totales */
.totcard{background:linear-gradient(135deg,var(--azul-dk),var(--azul-xdk));border-radius:var(--r);padding:18px 22px;color:#fff}
.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.trow.main{font-size:20px;font-weight:800;border-top:1.5px solid rgba(255,255,255,.25);margin-top:10px;padding-top:12px}
.tv{font-family:var(--mono)}

/* TABLA */
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:var(--bg);color:var(--text-2);padding:8px 11px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border-bottom:1.5px solid var(--border)}
.dt td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:hover td{background:#FAFBFC}
.dt .num{text-align:right;font-family:var(--mono);font-weight:600}
.dt .trtot td{font-weight:700;background:var(--azul-lt);color:var(--azul)}
.tbox{overflow-x:auto;border:1px solid var(--border);border-radius:8px}

/* CÓMO SE CALCULÓ */
.cs-step{background:var(--bg);border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:3px solid var(--azul)}
.cs-t{font-weight:700;font-size:13px;color:var(--azul)}
.cs-f{font-size:12px;color:var(--text-2);margin:3px 0;font-style:italic}
.cs-v{font-size:11px;color:var(--text-3)}
.cs-r{font-size:14px;font-weight:800;color:var(--ok);text-align:right;margin-top:4px;font-family:var(--mono)}

/* CHART */
.cwrap{max-width:300px;margin:0 auto 14px}
/* PROGRESS */
.pbw{background:var(--border);border-radius:10px;height:6px;flex:1;min-width:60px}
.pb{height:6px;border-radius:10px;background:var(--azul)}

/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.mbg.open{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:26px;width:92%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:var(--shm)}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mhdr h3{font-size:16px;font-weight:800}
.atabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.at{padding:6px 14px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-2);background:transparent;font-family:var(--font);transition:.15s}
.at.active{background:var(--azul);color:#fff;border-color:var(--azul)}

/* TOAST */
.tc{position:fixed;top:72px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface);border-radius:10px;padding:11px 15px;box-shadow:var(--shm);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;min-width:260px;pointer-events:all;border:1px solid var(--border);border-left:4px solid var(--ok);animation:tIn .25s ease}
.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--err)}.toast.info{border-left-color:var(--info)}
@keyframes tIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tOut{from{opacity:1}to{transform:translateX(110%);opacity:0}}
.toast.out{animation:tOut .25s ease forwards}

/* GUÍA */
.gcol2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gsec{margin-bottom:4px}
.gsec h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--border)}
.gsec p,.gsec li{font-size:13px;color:var(--text-2);line-height:1.65}
.gsec ul{padding-left:18px;margin-bottom:8px}

/* FOOTER */
.footer{text-align:center;font-size:11px;color:var(--text-3);padding:20px;border-top:1px solid var(--border);margin-top:8px}

/* CHAT IA */
.chat-fab{position:fixed;bottom:28px;right:28px;width:52px;height:52px;border-radius:50%;background:var(--azul);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(21,101,192,.45);z-index:300;display:flex;align-items:center;justify-content:center;transition:.2s}
.chat-fab:hover{background:var(--azul-dk);transform:scale(1.05)}
.chat-panel{position:fixed;bottom:92px;right:28px;width:380px;max-height:560px;background:var(--surface);border-radius:16px;box-shadow:var(--shm);z-index:300;display:none;flex-direction:column;border:1px solid var(--border);overflow:hidden}
.chat-panel.open{display:flex}
.chat-hdr{background:var(--azul);padding:14px 18px;display:flex;align-items:center;gap:10px;color:#fff}
.ch-ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ch-ttl{font-size:14px;font-weight:700}.ch-sub{font-size:11px;opacity:.75}
.ch-cls{margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.75;padding:0 4px}.ch-cls:hover{opacity:1}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.chat-bubble{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.55}
.chat-bubble.user{background:var(--azul);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.asst{background:var(--bg);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--border)}
.chat-bubble.typing{color:var(--text-3);font-style:italic}
.chat-sugs{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.chat-sug{background:var(--azul-lt);color:var(--azul);border:none;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.chat-sug:hover{background:var(--azul);color:#fff}
.chat-inp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}
.chat-inp textarea{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--font);resize:none;height:42px;line-height:1.4;transition:.2s}
.chat-inp textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.chat-inp button{width:42px;height:42px;border-radius:8px;background:var(--azul);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;transition:.15s}
.chat-inp button:hover{background:var(--azul-dk)}.chat-inp button:disabled{background:var(--border);cursor:not-allowed}

@media print{.hdr,.navrow,.mn,.stepper,.rtabs,.chat-fab,.chat-panel{display:none!important}.page{padding:0}.card{box-shadow:none}}
@media(max-width:700px){.sgrid,.gcol2{grid-template-columns:1fr 1fr!important}.fg,.fg.g3,.rcols{grid-template-columns:1fr!important}.chat-panel{width:calc(100vw - 40px);right:20px}}
</style>
</head>

<div class="tc" id="tc"></div>
